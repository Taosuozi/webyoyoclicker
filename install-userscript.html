<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安装 YoyoClicker Bilibili 脚本</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            color: #222;
            font-family: "Microsoft YaHei", Arial, sans-serif;
        }

        main {
            width: min(720px, calc(100vw - 32px));
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 28px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-size: 24px;
        }

        p {
            line-height: 1.7;
        }

        a.install {
            display: inline-block;
            margin: 12px 0 18px;
            padding: 12px 18px;
            border-radius: 6px;
            background: #1677ff;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
        }

        code {
            background: #f1f3f5;
            border-radius: 4px;
            padding: 2px 5px;
        }

        ol {
            padding-left: 22px;
            line-height: 1.8;
        }
    </style>
</head>
<body>
    <main>
        <h1>安装 YoyoClicker Bilibili 脚本</h1>
        <p>请先确认浏览器已经安装并启用 Tampermonkey，然后点击下面的安装链接。</p>

        <a class="install" href="bilibili-score-overlay.user.js">安装用户脚本</a>

        <p>如果点击后没有弹出 Tampermonkey 安装页，请手动安装：</p>
        <ol>
            <li>打开 Tampermonkey 管理面板。</li>
            <li>点击“添加新脚本”。</li>
            <li>删除默认内容。</li>
            <li>打开 <code>bilibili-score-overlay.user.js</code>，复制全部内容粘贴进去。</li>
            <li>按 <code>Ctrl + S</code> 保存。</li>
            <li>打开 Bilibili 视频页测试。</li>
        </ol>
    </main>
</body>
</html>
